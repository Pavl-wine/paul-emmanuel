<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paul Emmanuel — Commandes</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:14px;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f8f5f0;color:#1a0a08;min-height:100vh;padding-bottom:100px;}
.sync-bar{background:#3d1020;color:#e8c96a;font-size:11px;padding:4px 20px;display:flex;align-items:center;gap:8px;}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#e8c96a;}
.sync-dot.ko{background:#e24b4a;}
.sync-bar button{margin-left:auto;background:none;border:1px solid rgba(232,201,106,.4);color:#e8c96a;border-radius:5px;font-size:11px;padding:2px 9px;cursor:pointer;font-family:inherit;}
nav{background:#3d1020;display:flex;align-items:center;padding:0 20px;height:52px;border-bottom:2px solid #c9a84c;position:sticky;top:0;z-index:50;}
.brand{color:#c9a84c;font-size:16px;font-weight:700;letter-spacing:.04em;margin-right:24px;white-space:nowrap;}
.tabs{display:flex;flex:1;overflow-x:auto;}
.tab{padding:0 16px;height:52px;display:flex;align-items:center;font-size:14px;font-weight:500;color:rgba(255,255,255,.55);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;user-select:none;text-decoration:none;}
.tab:hover{color:rgba(255,255,255,.85);}
.tab.active{color:#c9a84c;border-bottom-color:#c9a84c;}
.page{padding:20px;max-width:900px;margin:0 auto;}
.hdr{background:#3d1020;color:white;border-radius:10px;padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.hdr h2{font-size:18px;font-weight:700;color:#e8c96a;margin-bottom:2px;}
.hdr p{font-size:12px;color:rgba(255,255,255,.6);}
.hdr-n{font-size:28px;font-weight:300;color:#e8c96a;line-height:1;text-align:right;}
.hdr-l{font-size:11px;color:rgba(255,255,255,.5);text-align:right;}
.sec{font-size:11px;font-weight:700;color:#8a7060;text-transform:uppercase;letter-spacing:.08em;margin:20px 0 8px;display:flex;justify-content:space-between;align-items:center;}
.sec button{background:none;border:none;color:#8a7060;font-size:11px;cursor:pointer;text-decoration:underline;font-family:inherit;}
.fi{width:100%;padding:10px 12px;border:1px solid #ddd5c8;border-radius:8px;font-size:15px;background:white;font-family:inherit;outline:none;margin-bottom:4px;}
.fi:focus{border-color:#6b2737;}
/* Cartes commandes */
.oc{background:white;border:1px solid #e0d8d0;border-left:4px solid #3b6d11;border-radius:10px;padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:border-color .12s;}
.oc:hover{border-color:#c9a84c;}
.oc.part{border-left-color:#c98a1b;}
.oc.wait{border-left-color:#c8bfb5;opacity:.75;}
.oc-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.oc-cli{font-size:16px;font-weight:600;}
.oc-bt{font-size:15px;font-weight:600;color:#6b2737;white-space:nowrap;}
.oc-sub{font-size:12px;color:#8a7060;margin-top:3px;}
.st{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
.st-ok{background:#eaf3de;color:#27500a;}
.st-part{background:#fdf1dc;color:#854f0b;}
.st-wait{background:#f0ebe3;color:#5a4030;}
.empty{text-align:center;padding:40px 20px;color:#8a7060;background:white;border:1px dashed #ddd5c8;border-radius:10px;}
/* Liste de prélèvement */
.back{background:none;border:none;color:#6b2737;font-size:14px;font-weight:600;cursor:pointer;padding:4px 0 12px;font-family:inherit;}
.bar{height:6px;background:rgba(255,255,255,.15);border-radius:3px;margin-top:10px;overflow:hidden;}
.bar div{height:100%;background:#e8c96a;transition:width .2s;}
.pr{background:white;border:1px solid #e0d8d0;border-radius:10px;padding:14px;margin-bottom:8px;display:flex;gap:14px;align-items:center;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;}
.pr.done{background:#f4f9ee;border-color:#b9d79a;}
.pr.done .pw{text-decoration:line-through;color:#8a7060;}
.pr.na{cursor:default;background:#faf8f4;border-style:dashed;}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid #c8bfb5;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:white;flex-shrink:0;}
.pr.done .chk{background:#3b6d11;border-color:#3b6d11;}
.pr.na .chk{border-style:dashed;}
.loc{min-width:84px;text-align:center;flex-shrink:0;}
.loc b{display:block;background:#3d1020;color:#e8c96a;border-radius:6px;padding:6px 8px;font-size:14px;font-weight:700;}
.loc small{display:block;font-size:10px;color:#8a7060;margin-top:3px;}
.loc .lna{background:#f0ebe3;color:#854f0b;font-size:11px;font-weight:600;border-radius:6px;padding:6px;}
.pinfo{flex:1;min-width:0;}
.pw{font-size:14px;font-weight:600;}
.pd{font-size:12px;color:#8a7060;margin-top:2px;}
.pq{font-size:22px;font-weight:600;color:#6b2737;flex-shrink:0;text-align:right;line-height:1;}
.pq small{display:block;font-size:10px;color:#8a7060;font-weight:400;}
.note{background:#fdf1dc;color:#854f0b;border-radius:8px;padding:10px 12px;font-size:13px;margin:10px 0;}
/* Photo */
.ph{background:white;border:1px solid #e0d8d0;border-radius:10px;padding:14px;margin-top:16px;}
.ph h3{font-size:14px;font-weight:600;margin-bottom:4px;}
.ph p{font-size:12px;color:#8a7060;}
.ph-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.btn{padding:10px 14px;border:1px solid #ddd5c8;border-radius:8px;background:white;font-size:13px;cursor:pointer;font-family:inherit;color:#3d1020;font-weight:600;}
.btn input{display:none;}
.ph img{max-width:100%;max-height:260px;border-radius:8px;margin-top:10px;display:none;}
.ai{margin-top:10px;border-radius:8px;padding:10px 12px;font-size:13px;display:none;}
.ai b{display:block;margin-bottom:3px;}
.ai.ok{background:#eaf3de;color:#27500a;}
.ai.ko{background:#fcebeb;color:#791f1f;}
.ai.wait{background:#f0ebe3;color:#5a4030;}
.ai ul{margin:6px 0 0 18px;}
/* Pied */
.foot{position:fixed;left:0;right:0;bottom:0;background:white;border-top:1px solid #e0d8d0;padding:12px 20px;display:none;align-items:center;justify-content:space-between;gap:12px;z-index:40;box-shadow:0 -2px 10px rgba(0,0,0,.05);}
.foot.on{display:flex;}
.foot span{font-size:13px;color:#5a4030;}
.vbtn{padding:13px 22px;background:#6b2737;color:#e8c96a;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;}
.vbtn:disabled{background:#c8bfb5;color:#8a7060;cursor:not-allowed;}
.vbtn.done{background:#3b6d11;color:white;}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#3d1020;color:#e8c96a;padding:10px 18px;border-radius:8px;font-size:13px;display:none;z-index:60;max-width:90vw;text-align:center;}
.spin{width:22px;height:22px;border:3px solid #e0d8d0;border-top-color:#6b2737;border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px;}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:600px){
  nav{padding:0 10px;}.brand{font-size:13px;margin-right:8px;}.tab{padding:0 12px;}
  .page{padding:12px;}.hdr{padding:14px;}
  .pr{gap:10px;padding:12px 10px;}.loc{min-width:70px;}.loc b{font-size:13px;padding:5px 6px;}
  .foot{padding:10px 12px;}.vbtn{padding:12px 16px;font-size:14px;}
}
</style>
</head>
<body>

<div class="sync-bar"><div class="sync-dot" id="dot"></div><span id="sync">Connexion…</span><button onclick="loadAll()">Actualiser</button></div>

<nav>
  <div class="brand">Paul Emmanuel</div>
  <div class="tabs">
    <a class="tab" href="reception.html">Réception</a>
    <div class="tab active" onclick="showList()">Commandes</div>
  </div>
</nav>

<div class="page" id="page"><div class="empty"><div class="spin"></div>Chargement…</div></div>

<div class="foot" id="foot"><span id="foot-l"></span><button class="vbtn" id="vbtn" onclick="valider()">Valider la commande</button></div>
<div class="toast" id="toast"></div>

<script>
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxwPQjW-6LUMw5gQdn3K70_dfkGVHT-Mv29SZPNGmD1NZTodTcidPgIDzkzJIqwkkVw/exec';
var TOKEN = 'PE2026secure';
var CMDS = [], EMPL = [], ORDERS = [], cur = null, picks = {}, done = {}, photo = null, q = '', showWait = false;

function he(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(x){var n=parseFloat(String(x).replace(',','.'));return isNaN(n)?0:n;}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none';},3000);}
function sync(m,ok){document.getElementById('sync').textContent=m;document.getElementById('dot').className='sync-dot'+(ok===false?' ko':'');}

/* ── Données ── */
function loadAll(){
  sync('Lecture du Sheets…');
  return fetch(SCRIPT_URL+'?action=data').then(function(r){return r.json();}).then(function(d){
    if(!d.success)throw new Error(d.error||'');
    CMDS=d.commandes||[];EMPL=d.emplacements||[];
    build();
    sync('À jour · '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}));
    if(cur&&ORDERS.some(function(o){return o.id===cur;}))openOrder(cur);else{cur=null;showList();}
  }).catch(function(){
    sync('Impossible de lire le Sheets — vérifiez la connexion',false);
    if(!ORDERS.length)document.getElementById('page').innerHTML='<div class="empty">Pas de connexion au Sheets.<br><br><button class="btn" onclick="loadAll()">Réessayer</button></div>';
  });
}

var NIV={'haut':1,'milieu':2,'plan':3,'bas':4,'sol':5};
function locKey(e){var m=String(e||'').match(/^(\d+)-(\w+)/);if(m)return (+m[1])*10+(NIV[m[2].toLowerCase()]||9);return /r[ée]serve/i.test(e)?900:999;}

// Où prendre les bouteilles : les plus anciennes d'abord (comme le Sheets)
function lieux(ref,qte){
  var rows=EMPL.filter(function(e){return e.ref===ref;});
  rows.sort(function(a,b){return dt(a.date)-dt(b.date);});
  var out=[],reste=qte;
  rows.forEach(function(e){if(reste<=0)return;var p=Math.min(e.qte,reste);out.push({emp:e.emp,n:p});reste-=p;});
  return {out:out,manque:Math.max(0,reste),total:rows.reduce(function(a,e){return a+e.qte;},0)};
}
function dt(s){var m=String(s||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?new Date(+m[3],+m[2]-1,+m[1]).getTime():0;}

function build(){
  var by={};
  CMDS.forEach(function(x){
    var id=String(x['Commande']||x['N° Commande']||'').trim();if(!id)return;
    var su=String(x['Suivi']||'').trim();if(/termin/i.test(su))return;
    var o=by[id]||(by[id]={id:id,client:String(x['Client']||'').trim(),lines:[]});
    var ref=String(x['Référence']||'').trim(),qte=num(x['Quantité'])||1;
    var l={ref:ref,qte:qte,prod:String(x['Producteur']||'').trim(),cuvee:String(x['Cuvée']||'').trim(),mill:String(x['Millésime']||'').trim(),fmt:String(x['Format']||'').trim(),fourn:String(x['Fournisseur']||'').trim(),empCol:String(x['Emplacement']||'').trim(),attente:/attente/i.test(su)};
    if(l.attente||!ref){l.etat=l.attente?'attente':'sansref';}
    else{
      l.where=lieux(ref,qte);
      if(l.where.out.length&&!l.where.manque)l.etat='ok';
      else if(l.where.out.length)l.etat='partiel';
      else l.etat='nonrange';
    }
    l.key=l.etat==='ok'||l.etat==='partiel'?locKey(l.where.out[0].emp):1000;
    o.lines.push(l);
  });
  ORDERS=Object.keys(by).map(function(k){
    var o=by[k];
    o.lines.sort(function(a,b){return a.key-b.key;});
    o.bt=o.lines.reduce(function(a,l){return a+l.qte;},0);
    o.nok=o.lines.filter(function(l){return l.etat==='ok';}).length;
    o.nwait=o.lines.filter(function(l){return l.etat==='attente';}).length;
    o.state=o.nok===o.lines.length?'ok':(o.nok===0&&o.nwait===o.lines.length?'wait':'part');
    return o;
  }).sort(function(a,b){var r={ok:0,part:1,wait:2};return r[a.state]-r[b.state]||a.id.localeCompare(b.id);});
}

/* ── Liste des commandes ── */
function showList(){
  cur=null;document.getElementById('foot').classList.remove('on');
  var f=function(o){return !q||(o.client+' '+o.id).toLowerCase().indexOf(q)>=0;};
  var ready=ORDERS.filter(function(o){return o.state!=='wait'&&f(o);});
  var wait=ORDERS.filter(function(o){return o.state==='wait'&&f(o);});
  var nReady=ORDERS.filter(function(o){return o.state==='ok';}).length;
  var h='<div class="hdr"><div><h2>Commandes à préparer</h2><p>Touchez une commande pour ouvrir sa liste de prélèvement</p></div>'
    +'<div><div class="hdr-n">'+nReady+'</div><div class="hdr-l">prête'+(nReady>1?'s':'')+'</div></div></div>';
  if(ORDERS.length>6)h+='<input class="fi" type="search" placeholder="Rechercher un client…" value="'+he(q)+'" oninput="q=this.value.toLowerCase();showList();this.focus();">';
  h+='<div class="sec">À préparer</div>';
  h+=ready.length?ready.map(card).join(''):'<div class="empty">Rien à préparer pour le moment.</div>';
  if(wait.length){
    h+='<div class="sec"><span>En attente fournisseur ('+wait.length+')</span><button onclick="showWait=!showWait;showList()">'+(showWait?'masquer':'afficher')+'</button></div>';
    if(showWait)h+=wait.map(card).join('');
  }
  var p=document.getElementById('page');p.innerHTML=h;
  var inp=p.querySelector('input');if(inp&&q){inp.setSelectionRange(q.length,q.length);}
}
function card(o){
  var st=o.state==='ok'?'<span class="st st-ok">Prête</span>'
    :o.state==='part'?'<span class="st st-part">'+o.nok+' / '+o.lines.length+' vins prêts</span>'
    :'<span class="st st-wait">Pas encore arrivée</span>';
  var fourn=o.state==='wait'?o.lines.map(function(l){return l.fourn;}).filter(function(v,i,a){return v&&a.indexOf(v)===i;}).slice(0,2).join(', '):'';
  return '<div class="oc '+o.state+'" onclick="openOrder(\''+he(o.id)+'\')"><div class="oc-top"><span class="oc-cli">'+he(o.client||'—')+'</span><span class="oc-bt">'+o.bt+' bt</span></div>'
    +'<div class="oc-sub">'+he(o.id)+' · '+o.lines.length+' vin'+(o.lines.length>1?'s':'')+(fourn?' · '+he(fourn):'')+'</div>'+st+'</div>';
}

/* ── Liste de prélèvement ── */
function openOrder(id){
  var o=ORDERS.filter(function(x){return x.id===id;})[0];if(!o)return showList();
  if(cur!==id){photo=null;}
  cur=id;if(!picks[id])picks[id]={};
  var pk=picks[id],okL=o.lines.filter(function(l){return l.etat==='ok';});
  var bt=okL.reduce(function(a,l){return a+l.qte;},0);
  var got=o.lines.reduce(function(a,l,i){return a+(pk[i]?l.qte:0);},0);
  var h='<button class="back" onclick="showList()">← Toutes les commandes</button>'
    +'<div class="hdr" style="display:block"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-end"><div><h2>'+he(o.client||'—')+'</h2><p>'+he(o.id)+' · prélevez dans l\'ordre, emplacement par emplacement</p></div>'
    +'<div><div class="hdr-n">'+got+'/'+bt+'</div><div class="hdr-l">bouteilles</div></div></div>'
    +'<div class="bar"><div style="width:'+(bt?Math.round(got/bt*100):0)+'%"></div></div></div>';
  var miss=o.lines.length-okL.length;
  if(miss)h+='<div class="note">'+miss+' vin'+(miss>1?'s ne sont':' n\'est')+' pas encore prêt'+(miss>1?'s':'')+' (voir en bas). Préparez le reste, mais ne validez la commande que quand tout est là.</div>';
  o.lines.forEach(function(l,i){
    var ok=l.etat==='ok',d=pk[i],loc,detail='';
    if(ok){
      loc='<b>'+he(l.where.out[0].emp)+'</b>'+(l.where.out.length>1?'<small>puis '+l.where.out.slice(1).map(function(w){return he(w.emp)+' ('+w.n+')';}).join(', ')+'</small>':'');
      if(l.where.out.length>1)detail=' · '+l.where.out[0].n+' bt en '+he(l.where.out[0].emp);
    }else{
      var lab={attente:'Pas encore reçu',sansref:'Prévenir Paul',nonrange:'Pas encore rangé',partiel:'Stock insuffisant'}[l.etat];
      loc='<div class="lna">'+lab+'</div>';
      detail={attente:' · en attente'+(l.fourn?' de '+he(l.fourn):' fournisseur'),
              sansref:' · pas encore relié au stock',
              nonrange:' · à ranger d\'abord (Réception → Ranger l\'existant)',
              partiel:' · seulement '+(l.where?l.where.total:0)+' en cave'}[l.etat];
    }
    h+='<div class="pr'+(ok?(d?' done':''):' na')+'"'+(ok?' onclick="pick('+i+')"':'')+'>'
      +'<div class="chk">'+(d?'✓':'')+'</div>'
      +'<div class="loc">'+loc+'</div>'
      +'<div class="pinfo"><div class="pw">'+he(l.prod)+(l.cuvee?' — '+he(l.cuvee):'')+'</div><div class="pd">'+he(l.mill||'')+(l.fmt&&l.fmt!=='75cl'?' · '+he(l.fmt):'')+(l.ref?' · '+he(l.ref):'')+detail+'</div></div>'
      +'<div class="pq">'+l.qte+'<small>bt</small></div></div>';
  });
  h+='<div class="ph"><h3>Vérification photo (facultatif)</h3><p>Une photo de la caisse ouverte, étiquettes visibles : l\'IA compare avec la liste.</p>'
    +'<div class="ph-row"><label class="btn">📷 Prendre la photo<input type="file" accept="image/*" capture="environment" onchange="takePhoto(this)"></label>'
    +'<button class="btn" id="ai-btn" onclick="checkPhoto()" '+(photo?'':'disabled style="opacity:.5"')+'>Vérifier</button></div>'
    +'<img id="ph-img"'+(photo?' src="'+photo+'" style="display:block"':'')+'><div class="ai" id="ai"></div></div>';
  document.getElementById('page').innerHTML=h;
  var allPicked=okL.length&&o.lines.every(function(l,i){return l.etat!=='ok'||pk[i];});
  var f=document.getElementById('foot'),b=document.getElementById('vbtn');f.classList.add('on');
  if(done[id]){b.disabled=true;b.className='vbtn done';b.textContent='✓ Validée';document.getElementById('foot-l').textContent='Stock et emplacements mis à jour';}
  else{
    b.className='vbtn';b.textContent='Valider la commande';b.disabled=!(allPicked&&!miss);
    document.getElementById('foot-l').textContent=miss?'Commande incomplète':(allPicked?'Tout est prélevé':'Cochez chaque vin prélevé');
  }
}
function pick(i){picks[cur][i]=!picks[cur][i];var y=window.scrollY;openOrder(cur);window.scrollTo(0,y);}

function valider(){
  var o=ORDERS.filter(function(x){return x.id===cur;})[0];if(!o)return;
  if(!confirm('Valider la commande de '+o.client+' ?\n\nLes '+o.bt+' bouteilles sortent du stock et de leurs emplacements.'))return;
  var b=document.getElementById('vbtn');b.disabled=true;b.textContent='Envoi…';
  var id=cur;
  fetch(SCRIPT_URL+'?action=valider_commande&commande='+encodeURIComponent(id)+'&token='+TOKEN)
    .then(function(r){return r.json();})
    .then(function(r){
      if(!r.success)throw new Error(r.error||'');
      done[id]=true;toast('✓ Commande validée');openOrder(id);
      setTimeout(function(){delete picks[id];loadAll();},2500);
    }).catch(function(e){b.disabled=false;b.textContent='Valider la commande';toast('Échec de l\'envoi — réessayez'+(e&&e.message?' ('+e.message+')':''));});
}

/* ── Photo : réduite dans le téléphone, analysée via le script Google ── */
function takePhoto(input){
  var file=input.files&&input.files[0];if(!file)return;
  var img=new Image(),url=URL.createObjectURL(file);
  img.onload=function(){
    var M=1600,w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,M/Math.max(w,h));
    var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    photo=c.toDataURL('image/jpeg',0.82);URL.revokeObjectURL(url);
    var el=document.getElementById('ph-img');el.src=photo;el.style.display='block';
    var bt=document.getElementById('ai-btn');bt.disabled=false;bt.style.opacity=1;
    document.getElementById('ai').style.display='none';
  };
  img.onerror=function(){toast('Photo illisible — reprenez-la');};
  img.src=url;
}
function aiBox(cls,html){var a=document.getElementById('ai');a.className='ai '+cls;a.innerHTML=html;a.style.display='block';}
function checkPhoto(){
  var o=ORDERS.filter(function(x){return x.id===cur;})[0];if(!o||!photo)return;
  var att=o.lines.filter(function(l){return l.etat==='ok';}).map(function(l,i){return (i+1)+'. '+l.prod+' '+l.cuvee+(l.mill?' '+l.mill:'')+' ×'+l.qte;}).join('\n');
  var prompt='Tu es un expert en vins chargé de valider la préparation d\'une caisse. Références attendues :\n'+att
    +'\n\nAnalyse la photo : pour chaque bouteille visible, lis le nom du vin et le millésime sur l\'étiquette et compare avec la liste.'
    +' Réponds UNIQUEMENT en JSON : {"ok":true|false,"resume":"une phrase","erreurs":["écarts éventuels"],"bouteilles_vues":N}.'
    +' Si une étiquette est illisible, indique-le dans les erreurs.';
  aiBox('wait','<b>Analyse en cours…</b>Lecture des étiquettes, une dizaine de secondes.');
  fetch(SCRIPT_URL+'?action=verifier_photo&token='+TOKEN,{method:'POST',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({mediaType:'image/jpeg',imageData:photo.split(',')[1],prompt:prompt})})
  .then(function(r){return r.json();})
  .then(function(r){
    var res=r&&r.result;
    if(!r.success)throw {msg:r.error||'Erreur du script'};
    if(res&&res.type==='error'){
      var t=res.error&&res.error.type;
      if(t==='authentication_error'||t==='permission_error')throw {msg:'Clé IA refusée — prévenir Paul. La commande peut quand même être validée.'};
      if(t==='overloaded_error'||t==='rate_limit_error')throw {msg:'Service IA occupé — réessayez dans une minute.'};
      throw {msg:'Photo non analysée ('+(res.error&&res.error.message||t)+').'};
    }
    var txt=(res&&res.content&&res.content[0]&&res.content[0].text)||'';
    var m=txt.match(/\{[\s\S]*\}/),j=null;try{j=m&&JSON.parse(m[0]);}catch(e){}
    if(!j){aiBox('wait','<b>Analyse</b>'+he(txt||'Réponse vide — reprenez la photo.'));return;}
    var errs=(j.erreurs||[]).length?'<ul>'+j.erreurs.map(function(e){return '<li>'+he(e)+'</li>';}).join('')+'</ul>':'';
    if(j.ok)aiBox('ok','<b>✓ Caisse conforme</b>'+he(j.resume||'')+(j.bouteilles_vues?'<br><small>'+j.bouteilles_vues+' bouteilles vues</small>':''));
    else aiBox('ko','<b>Écarts détectés</b>'+he(j.resume||'')+errs);
  })
  .catch(function(e){aiBox('ko','<b>Vérification impossible</b>'+he(e&&e.msg?e.msg:'Pas de connexion — réessayez.'));});
}

loadAll();
setInterval(function(){if(!cur)loadAll();},120000);
</script>
